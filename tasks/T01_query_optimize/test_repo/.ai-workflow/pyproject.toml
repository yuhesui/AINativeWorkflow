[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-native-workflow-cli"
version = "5.6.35"
description = "Deterministic repository helpers for AI-Native Workflow v5.6.35"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
aw = "aw.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aw*"]

[tool.setuptools.package-data]
aw = ["templates/**/*.md", "templates/**/*.yaml", "templates/**/*.json"]
