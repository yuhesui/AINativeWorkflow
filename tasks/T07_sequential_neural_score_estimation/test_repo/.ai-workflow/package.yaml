workflow_version: "5.6.35"
specification_revision: "5.6"
canonical_state: ".ai-workflow/STATE.json"
canonical_hierarchy: ["Goal", "Plan", "Phase", "DIC", "EPS", "Prompt/Run", "Action"]
canonical_roles: ["Main", "Theory", "Experiment"]
compatibility_aliases:
  Orchestrator: "Main/orchestration capability"
  Researcher: "Theory/research capability"
phase:
  dic:
    model: "one multi-view DIC package per Phase"
    required_views: ["README.md", "REQUESTS.md", "PLAN.md"]
    optional_views: ["ARCHITECTURE.md", "TEST_MATRIX.md"]
    custom_views: true
    plan_semantics: "durable prompt graph including dependencies, parallel subagent batches, merges and conditional branches"
  eps:
    semantics: "disposable just-in-time instantiation of DIC/PLAN prompt nodes"
    prompt_materialization: true
  lanes:
    minor: "auto"
    research: "auto"
    verification: "auto"
    checkpoints: "auto"
    allowed_modes: ["off", "auto", "on"]
  reports:
    always_present: true
    flat: true
    max_files_default: 10
    include_human_report: true
    include_key_merged_raw_results: true
checkpoint_interval_default: 7
human_governance: "Plan approval plus periodic/material checkpoints"
machine_execution: "Phase/DIC/EPS/Prompt/Action"
legacy_compatibility:
  aw_py_goal_structured_cli: true
  status: "compatibility surface; not competing canonical authority"
